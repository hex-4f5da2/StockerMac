name: macOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Telegraph checks (swiftc)
        run: |
          swiftc -parse-as-library Sources/StockerCore/Models/*.swift \
            Sources/StockerCore/Networking/*.swift \
            Sources/StockerCore/Persistence/*.swift \
            Sources/StockerCore/App/*.swift \
            Tests/TelegraphChecks.swift -o .build/telegraph-checks
          .build/telegraph-checks

      - name: Package app
        run: ./Scripts/build-app.sh

      - name: Verify app bundle
        run: |
          plutil -lint App/Info.plist
          test -x dist/Stocker.app/Contents/MacOS/StockerMac
          test -f dist/Stocker.app/Contents/Resources/AppIcon.icns
