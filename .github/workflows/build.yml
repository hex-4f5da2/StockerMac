name: macOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Package app
        run: ./Scripts/build-app.sh

      - name: Verify app bundle
        run: |
          plutil -lint App/Info.plist
          test -x dist/Stocker.app/Contents/MacOS/StockerMac
          test -f dist/Stocker.app/Contents/Resources/AppIcon.icns
